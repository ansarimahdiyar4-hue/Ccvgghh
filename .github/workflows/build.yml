name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project and join core
        run: |
          set -e
          ls -la
          unzip -q ./*.zip -d src
          cat libbox.aar.part-* > src/Bepar-VPN-Android/app/libs/libbox.aar
          ls -la src/Bepar-VPN-Android/app/libs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        working-directory: src/Bepar-VPN-Android
        run: gradle assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"

      - uses: actions/upload-artifact@v4
        with:
          name: bepar-vpn-apk
          path: src/Bepar-VPN-Android/app/build/outputs/apk/debug/app-debug.apk
