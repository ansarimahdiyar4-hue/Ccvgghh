name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project and join core
        run: |
          set -euo pipefail
          ls -la
          unzip -q ./*.zip -d src
          test -d src/Bepar-VPN-Android
          cat libbox.aar.part-* > src/Bepar-VPN-Android/app/libs/libbox.aar
          rm -f src/Bepar-VPN-Android/gradle/wrapper/gradle-wrapper.jar
          ls -la src/Bepar-VPN-Android/app/libs
          unzip -l src/Bepar-VPN-Android/app/libs/libbox.aar | tail -3

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          validate-wrappers: false

      - name: Build debug APK
        working-directory: src/Bepar-VPN-Android
        run: |
          OPTS='-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m'
          gradle assembleDebug --no-daemon --console=plain --stacktrace "$OPTS" \
            || { echo "First attempt failed, retrying once"; \
                 gradle assembleDebug --no-daemon --console=plain --stacktrace "$OPTS"; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bepar-vpn-apk
          path: src/Bepar-VPN-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build reports (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: src/Bepar-VPN-Android/app/build/reports
          if-no-files-found: ignore
